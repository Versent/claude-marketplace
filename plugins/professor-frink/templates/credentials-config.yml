# Professor Frink Credentials Configuration Template
# ==================================================
#
# This template is used by /professor-frink:init to generate .frink/credentials.yml
# The init process will customize this based on the actual tasks in your spec.
#
# The /professor-frink:run command will FAIL FAST if required credentials are missing.

# ============================================================================
# REQUIRED TOOLS
# ============================================================================
# Tools that must be installed before execution.
# The init process will check these and record versions.

tools:
  required:
    - name: node
      version: ">=20.0.0"
      install: "nvm install 20 && nvm use 20"
      verify: "node --version"
      needed_from: "Task Group 1"

    - name: npm
      version: ">=10.0.0"
      install: "Included with Node.js"
      verify: "npm --version"
      needed_from: "Task Group 1"

    - name: jq
      version: ">=1.6"
      install: "brew install jq"
      verify: "jq --version"
      needed_from: "Task parsing"

    # Add project-specific tools below
    # - name: docker
    #   version: ">=24.0.0"
    #   install: "https://docs.docker.com/get-docker/"
    #   verify: "docker --version"
    #   needed_from: "Task Group X (Local Development)"

    # - name: terraform
    #   version: ">=1.5.0"
    #   install: "brew install terraform"
    #   verify: "terraform --version"
    #   needed_from: "Task Group X (Infrastructure)"

    # - name: aws
    #   version: ">=2.0.0"
    #   install: "brew install awscli"
    #   verify: "aws --version"
    #   needed_from: "Task Group X (Infrastructure)"

  optional:
    - name: gh
      version: ">=2.0.0"
      install: "brew install gh"
      verify: "gh --version"
      needed_for: "GitHub API operations (branch protection, secrets)"

