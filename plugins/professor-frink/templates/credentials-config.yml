# ============================================================================
# OPTIONAL CREDENTIALS
# ============================================================================
# These enhance functionality but execution can proceed without them.

optional_credentials:
  - name: SLACK_WEBHOOK_URL
    needed_for: "CI/CD deployment notifications"
    description: "Slack incoming webhook for deployment notifications"
    how_to_obtain: |
      1. Slack > Apps > Incoming Webhooks
      2. Add to Workspace > Select Channel
      3. Copy Webhook URL
      4. Add to GitHub Secrets (not local env)
    skip_if_missing: true

  - name: GITHUB_TOKEN
    needed_for: "GitHub API operations"
    description: "GitHub personal access token for gh CLI"
    how_to_obtain: |
      1. GitHub > Settings > Developer Settings > Personal Access Tokens
      2. Generate new token with repo, workflow scopes
      3. gh auth login (interactive)
    skip_if_missing: true

  # - name: SENTRY_DSN
