  #   skip_if_missing: true

# ============================================================================
# TASK GROUP CREDENTIAL REQUIREMENTS
# ============================================================================
# Quick reference: which credentials are needed for each task group.
# The init process will populate this based on your actual tasks.

task_group_requirements:
  # 1: []  # Repository Foundation - no credentials
  # 2: ["AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_REGION"]
  # 3: []  # Local Dev - uses Docker, no cloud credentials
  # 4: ["AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY"]
  # 5: []  # CI/CD - optional: GITHUB_TOKEN, SLACK_WEBHOOK_URL
  # 6: ["AZURE_AD_TENANT_ID", "AZURE_AD_METADATA_URL"]
  # Add your task groups here...

# ============================================================================
# PREFLIGHT CHECKLIST
# ============================================================================
# Commands to verify your environment before /professor-frink:run
# These are run when entering a new task group.

preflight_commands:
  - description: "Verify Node.js version"
    command: "node --version | grep -E 'v2[0-9]\\.' && echo 'OK' || echo 'FAIL: Need Node 20+'"

  - description: "Verify jq is installed"
    command: "jq --version && echo 'OK' || echo 'FAIL: jq not installed'"

  # Uncomment and customize based on your project:
  # - description: "Verify Docker is running"
  #   command: "docker info >/dev/null 2>&1 && echo 'OK' || echo 'FAIL: Docker not running'"

  # - description: "Verify AWS credentials"
  #   command: "aws sts get-caller-identity && echo 'OK' || echo 'FAIL: AWS not configured'"

  # - description: "Verify Terraform"
  #   command: "terraform --version && echo 'OK' || echo 'FAIL: Terraform not installed'"

# ============================================================================
# VALIDATION PATTERNS
# ============================================================================
# Regex patterns to validate credential formats.

validation:
  fail_fast: true
  show_masked_values: true
  patterns:
    AWS_ACCESS_KEY_ID: "^AKIA[A-Z0-9]{16}$"
    AWS_SECRET_ACCESS_KEY: "^[A-Za-z0-9/+=]{40}$"
    GITHUB_TOKEN: "^(ghp_|github_pat_)[A-Za-z0-9_]+$"
    # Add more patterns as needed
